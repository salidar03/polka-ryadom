services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polka
      POSTGRES_USER: polka
      POSTGRES_PASSWORD: polka
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polka -d polka"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://polka:polka@db:5432/polka
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  dbdata:
